formats:
  - oas3

extends:
  - [spectral:oas, recommended]

rules:
  # Downgraded to warn for now: several schemas declare an integer `version`
  # property with `default: null` (e.g. catalog-products-api's
  # Product.version), which oas3-valid-schema-example flags as a type
  # mismatch even though a null default is intentional here.
  oas3-valid-schema-example: warn
