name: OpenLint bundle CI

on:
  pull_request:
    branches: [main]
    paths:
      - openlint/openlint-rules.yml
      - openlint/rules/**
      - openlint/scripts/**
      - openlint/fixtures/**
      - openlint/package.json
      - openlint/package-lock.json
      - openlint/.gitignore
      - tools/package.json
      - tools/package-lock.json
      - .github/workflows/openlint-ci.yml
  push:
    branches: [main]
    paths:
      - openlint/openlint-rules.yml
      - openlint/rules/**
      - openlint/scripts/**
      - openlint/fixtures/**
      - openlint/package.json
      - openlint/package-lock.json
      - openlint/.gitignore
      - tools/package.json
      - tools/package-lock.json
      - .github/workflows/openlint-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlint-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify committed build input
        shell: bash
        run: |
          test -s openlint/package-lock.json || {
            echo "::error file=openlint/package-lock.json::Commit the npm lockfile required by setup-node caching and npm ci."
            exit 1
          }
          test -s tools/package-lock.json || {
            echo "::error file=tools/package-lock.json::Commit the npm lockfile for the pinned OpenLint CLI."
            exit 1
          }

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: |
            openlint/package-lock.json
            tools/package-lock.json

      - name: Build and verify bundle
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix openlint
          npm ci --ignore-scripts --prefix tools
          npm run bundle --prefix openlint
          npm run verify:bundle --prefix openlint
          sha256sum openlint/dist/openlint.js > openlint/dist/openlint.js.sha256

      - name: Run fixture lint scripts when supplied
        working-directory: openlint
        shell: bash
        run: |
          if npm pkg get scripts.lint:fixtures | grep -vq '^{}$'; then
            npm run lint:fixtures
          else
            echo 'Fixture suite is not present in this increment.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openlint-bundle-${{ github.sha }}
          path: |
            openlint/dist/openlint.js
            openlint/dist/openlint.js.sha256
          if-no-files-found: error
          retention-days: 7
