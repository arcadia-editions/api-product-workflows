name: Release one manifest artifact

on:
  workflow_call:
    inputs:
      workflow_ref:
        description: Immutable api-product-workflows commit SHA or release tag.
        required: true
        type: string
      artifact:
        description: Resolved artifactId from the architecture manifest.
        required: true
        type: string
      version:
        required: true
        type: string
      next_version:
        required: true
        type: string
      default_branch:
        required: false
        default: main
        type: string
      architecture_manifest_uri:
        required: false
        default: https://raw.githubusercontent.com/arcadia-editions/arcadia-editions-architecture/main/zenwave-architecture.yml
        type: string
      architecture_repository:
        required: false
        default: arcadia-editions/arcadia-editions-architecture
        type: string
    secrets:
      checkout_token:
        required: false
      release_token:
        required: false
      architecture_token:
        required: true
      maven_username:
        required: false
      maven_password_or_token:
        required: false
      apicurio_username:
        required: false
      apicurio_password_or_token:
        required: false
      artifactory_username:
        required: false
      artifactory_password_or_token:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.artifact }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: artifact-releases
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.release_token || github.token }}
      MANIFEST_URI: ${{ inputs.architecture_manifest_uri }}
      ARTIFACT_ID: ${{ inputs.artifact }}
      RELEASE_VERSION: ${{ inputs.version }}
      NEXT_VERSION: ${{ inputs.next_version }}
      DEFAULT_BRANCH: ${{ inputs.default_branch }}
      ARCHITECTURE_REPOSITORY: ${{ inputs.architecture_repository }}
      MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_RELEASE_REPOSITORY_URL }}
      MAVEN_REPOSITORY_ID: ${{ vars.MAVEN_RELEASE_REPOSITORY_ID }}
      MAVEN_REPOSITORY_USERNAME: ${{ secrets.maven_username }}
      MAVEN_REPOSITORY_PASSWORD_OR_TOKEN: ${{ secrets.maven_password_or_token }}
      APICURIO_REGISTRY_URL: ${{ vars.APICURIO_REGISTRY_URL }}
      APICURIO_USERNAME: ${{ secrets.apicurio_username }}
      APICURIO_PASSWORD_OR_TOKEN: ${{ secrets.apicurio_password_or_token }}
      ARTIFACTORY_GENERIC_RELEASE_URL: ${{ vars.ARTIFACTORY_GENERIC_RELEASE_URL }}
      ARTIFACTORY_USERNAME: ${{ secrets.artifactory_username }}
      ARTIFACTORY_PASSWORD_OR_TOKEN: ${{ secrets.artifactory_password_or_token }}
      SPECTRAL_BUNDLE_URL: ${{ vars.SPECTRAL_BUNDLE_URL }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ inputs.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted workflow implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arcadia-editions/api-product-workflows
          ref: ${{ inputs.workflow_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          path: pipeline
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JBang
        uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de # main
        with:
          version: 0.138.0

      - name: Install pinned tools
        shell: bash
        run: chmod +x pipeline/scripts/artifacts/*.sh

      - name: Resolve artifact and verify release inputs
        id: preflight
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          record="$(jbang --quiet pipeline/scripts/artifacts/ManifestTool.java resolve "$MANIFEST_URI" "$repository" "$ARTIFACT_ID")"
          pipeline/scripts/artifacts/verify-release-inputs.sh \
            source "$record" "$RELEASE_VERSION" "$NEXT_VERSION" "$DEFAULT_BRANCH"
          echo "record=$(jq -c . <<< "$record")" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        id: prepare
        env:
          RECORD: ${{ steps.preflight.outputs.record }}
          RELEASE_REF: ${{ steps.preflight.outputs.ref }}
        shell: bash
        run: |
          type="$(jq -r .type <<< "$RECORD")"
          path="$(jq -r .path <<< "$RECORD")"
          git -C source config user.name 'arcadia-editions-release[bot]'
          git -C source config user.email 'arcadia-editions-release[bot]@users.noreply.github.com'
          git -C source switch -c "$RELEASE_REF"
          pipeline/scripts/artifacts/set-version.sh source "$type" "$path" "$RELEASE_VERSION"
          pipeline/scripts/artifacts/validate-artifact.sh source pipeline "$RECORD"
          git -C source add -- "$path"
          git -C source commit -m "Release $ARTIFACT_ID $RELEASE_VERSION"
          release_commit="$(git -C source rev-parse HEAD)"
          gh auth setup-git
          git -C source push origin "HEAD:refs/heads/$RELEASE_REF"
          git -C source tag -a "$RELEASE_REF" "$release_commit" -m "$ARTIFACT_ID v$RELEASE_VERSION"
          git -C source push origin "refs/tags/$RELEASE_REF"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Publish selected artifact
        id: publish
        env:
          RECORD: ${{ steps.preflight.outputs.record }}
        shell: bash
        run: |
          plan="[$RECORD]"
          pipeline/scripts/artifacts/execute-plan.sh \
            release "$plan" source pipeline pipeline/config/maven-settings.xml source/target/release

      - name: Create artifact-scoped GitHub release
        env:
          RELEASE_REF: ${{ steps.preflight.outputs.ref }}
          PACKAGES: ${{ steps.publish.outputs.packages }}
        shell: bash
        run: |
          mapfile -t assets < <(jq -r '.[] | .jar, .checksumFile' <<< "$PACKAGES")
          flags=(--verify-tag --latest=false --generate-notes)
          [[ "$RELEASE_VERSION" != *-* ]] || flags+=(--prerelease)
          gh release create "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" \
            --title "$ARTIFACT_ID v$RELEASE_VERSION" "${flags[@]}" "${assets[@]}"

      - name: Request architecture manifest update
        env:
          ARCHITECTURE_TOKEN: ${{ secrets.architecture_token }}
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          GH_TOKEN="$ARCHITECTURE_TOKEN" gh api "repos/$ARCHITECTURE_REPOSITORY/dispatches" \
            -f event_type=artifact-released \
            -f "client_payload[repository]=$repository" \
            -f "client_payload[artifactId]=$ARTIFACT_ID" \
            -f "client_payload[version]=$RELEASE_VERSION"

      - name: Commit next version and merge to main
        env:
          RECORD: ${{ steps.preflight.outputs.record }}
          RELEASE_REF: ${{ steps.preflight.outputs.ref }}
        shell: bash
        run: |
          type="$(jq -r .type <<< "$RECORD")"
          path="$(jq -r .path <<< "$RECORD")"
          pipeline/scripts/artifacts/set-version.sh source "$type" "$path" "$NEXT_VERSION"
          git -C source add -- "$path"
          git -C source commit -m "Prepare $ARTIFACT_ID $NEXT_VERSION"
          git -C source push origin "HEAD:refs/heads/$RELEASE_REF"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$RELEASE_REF" \
            --title "Release $ARTIFACT_ID $RELEASE_VERSION" \
            --body "Release $ARTIFACT_ID $RELEASE_VERSION and prepare $NEXT_VERSION.")"
          for attempt in $(seq 1 120); do
            [[ "$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != MERGED ]] || exit 0
            gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --merge --delete-branch && exit 0
            sleep 30
          done
          echo 'release PR did not merge before timeout' >&2
          exit 1
