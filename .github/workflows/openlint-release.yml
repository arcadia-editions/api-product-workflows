name: Release OpenLint bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v or openlint prefix.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-openlint
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: artifact-releases
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: |
            openlint/package-lock.json
            tools/package-lock.json

      - name: Validate release version and tag availability
        shell: bash
        run: |
          release="$INPUT_VERSION"
          [[ "$release" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "release version $release is not valid semantic versioning" >&2
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/openlint/v$release" >/dev/null; then
            echo "tag openlint/v$release already exists" >&2
            exit 1
          fi

      - name: Build and verify the bundle
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix openlint
          npm ci --ignore-scripts --prefix tools
          npm run bundle --prefix openlint
          npm run verify:bundle --prefix openlint
          sha256sum openlint/dist/openlint.js > openlint/dist/openlint.js.sha256

      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: openlint/dist/openlint.js

      - name: Tag and publish the release
        shell: bash
        run: |
          tag="openlint/v$INPUT_VERSION"
          git config user.name 'arcadia-editions-release[bot]'
          git config user.email 'arcadia-editions-release[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -f openlint/dist/openlint.js openlint/dist/openlint.js.sha256
          git commit -m "openlint v$INPUT_VERSION"
          git tag -a "$tag" -m "openlint v$INPUT_VERSION"
          git push origin "$tag"

          flags=(--verify-tag --latest=false --generate-notes)
          [[ "$INPUT_VERSION" != *-* ]] || flags+=(--prerelease)
          bundle_url="https://github.com/$GITHUB_REPOSITORY/raw/refs/tags/$tag/openlint/dist/openlint.js"
          bundle_sha="$(awk '{print $1}' openlint/dist/openlint.js.sha256)"

          gh release create "$tag" --title "openlint v$INPUT_VERSION" \
            --notes "$(printf 'Use OpenLint bundle at: %s\n\nOPENLINT_BUNDLE_SHA256=%s\n' "$bundle_url" "$bundle_sha")" \
            "${flags[@]}" \
            openlint/dist/openlint.js openlint/dist/openlint.js.sha256
