name: Provision Kafka (develop)

on:
  workflow_call:
    inputs:
      service_repo:
        description: Repository name inside the arcadia-editions org.
        required: true
        type: string
      pipeline_ref:
        description: Git ref to use when checking out the shared pipeline repository.
        required: false
        default: main
        type: string
      architecture_manifest_uri:
        required: false
        default: https://raw.githubusercontent.com/arcadia-editions/arcadia-editions-architecture/main/zenwave-architecture.yml
        type: string
      avro_imports:
        description: Comma-separated Avro schema files or folders, relative to the service repository root, loaded before owned schemas are bundled.
        required: false
        default: ""
        type: string
      java_distribution:
        required: false
        default: temurin
        type: string
      java_version:
        required: false
        default: "21"
        type: string
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

jobs:
  apply:
    name: Generate, plan and apply to develop
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      PIPELINE_TF_WORKSPACE: ${{ format('{0}-develop', inputs.service_repo) }}
      TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
      TF_VAR_kafka_id: ${{ vars.CONFLUENT_KAFKA_CLUSTER_ID }}
      TF_VAR_kafka_rest_endpoint: ${{ vars.CONFLUENT_KAFKA_REST_ENDPOINT }}
      TF_VAR_kafka_api_key: ${{ secrets.CONFLUENT_KAFKA_API_KEY }}
      TF_VAR_kafka_api_secret: ${{ secrets.CONFLUENT_KAFKA_API_SECRET }}
      TF_VAR_schema_registry_id: ${{ vars.CONFLUENT_SCHEMA_REGISTRY_ID }}
      TF_VAR_schema_registry_crn: ${{ vars.CONFLUENT_SCHEMA_REGISTRY_CRN }}
      TF_VAR_schema_registry_rest_endpoint: ${{ vars.CONFLUENT_SCHEMA_REGISTRY_REST_ENDPOINT }}
      TF_VAR_schema_registry_api_key: ${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_KEY }}
      TF_VAR_schema_registry_api_secret: ${{ secrets.CONFLUENT_SCHEMA_REGISTRY_API_SECRET }}
      TF_VAR_provisioned_from: ${{ format('develop@{0}', github.sha) }}
      AVRO_IMPORTS: ${{ inputs.avro_imports }}

    steps:
      - name: Checkout service repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arcadia-editions/${{ inputs.service_repo }}
          ref: develop
          path: service-repo

      - name: Checkout shared pipeline repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arcadia-editions/api-product-workflows
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          path: pipeline-repo

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Set up JBang
        uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de # main
        with:
          version: 0.138.0

      - name: Install ZenWave CLI alias
        uses: ./pipeline-repo/.github/actions/install-zenwave-alias
        with:
          alias: ${{ vars.ZENWAVE_ALIAS || 'release@zenwave360/zenwave-sdk' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Resolve AsyncAPI artifacts from the architecture manifest
        id: resolve
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.architecture_manifest_uri }}
        run: |
          repository="${{ inputs.service_repo }}"
          inventory="$(jbang --quiet ./pipeline-repo/scripts/artifacts/ManifestTool.java list "$MANIFEST_URI" "$repository")"
          files="$(jq -r '[.[] | select(.type == "asyncapi" or .type == "asyncapi-client")] | map(.path) | join(",")' <<< "$inventory")"
          [[ -n "$files" ]] || { echo "no asyncapi or asyncapi-client artifact declared for $repository" >&2; exit 1; }
          echo "asyncapi_files=$files" >> "$GITHUB_OUTPUT"

      - name: Generate Terraform from AsyncAPI
        shell: bash
        run: |
          chmod +x ./pipeline-repo/scripts/terraform/provision-kafka.sh
          ./pipeline-repo/scripts/terraform/provision-kafka.sh \
            ./service-repo \
            ./pipeline-repo \
            "${{ steps.resolve.outputs.asyncapi_files }}" \
            develop \
            "${{ inputs.service_repo }}"

      - name: Check Terraform inputs
        shell: bash
        run: |
          chmod +x ./pipeline-repo/scripts/terraform/assert-terraform-env.sh
          ./pipeline-repo/scripts/terraform/assert-terraform-env.sh \
            TF_VAR_confluent_cloud_api_key \
            TF_VAR_confluent_cloud_api_secret \
            TF_VAR_kafka_id \
            TF_VAR_kafka_rest_endpoint \
            TF_VAR_kafka_api_key \
            TF_VAR_kafka_api_secret \
            TF_VAR_schema_registry_id \
            TF_VAR_schema_registry_crn \
            TF_VAR_schema_registry_rest_endpoint \
            TF_VAR_schema_registry_api_key \
            TF_VAR_schema_registry_api_secret \
            TF_CLOUD_ORGANIZATION \
            TF_TOKEN_app_terraform_io \
            PIPELINE_TF_WORKSPACE

      - name: Terraform init
        working-directory: service-repo/target/terraform
        run: |
          unset TF_WORKSPACE
          terraform init

      - name: Terraform validate
        working-directory: service-repo/target/terraform
        run: |
          unset TF_WORKSPACE
          terraform validate

      - name: Terraform plan
        working-directory: service-repo/target/terraform
        run: |
          unset TF_WORKSPACE
          terraform plan -out=tfplan

      - name: Export plan text
        working-directory: service-repo/target/terraform
        run: terraform show -no-color tfplan > tfplan.txt

      # No approval gate: a successful plan against develop applies immediately.
      - name: Terraform apply
        working-directory: service-repo/target/terraform
        run: |
          unset TF_WORKSPACE
          terraform apply -auto-approve tfplan

      - name: Remove raw Terraform plan
        if: always()
        working-directory: service-repo/target/terraform
        run: rm -f tfplan

      - name: Upload generated Terraform
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.service_repo }}-terraform-develop
          path: |
            service-repo/target/terraform
            !service-repo/target/terraform/.terraform/**
          if-no-files-found: error
