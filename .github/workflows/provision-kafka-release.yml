name: Release Kafka provisioning bundle

on:
  workflow_call:
    inputs:
      service_repo:
        description: Repository name inside the arcadia-editions org.
        required: true
        type: string
      artifact:
        description: Path without extension or artifactId of the asyncapi/asyncapi-client artifact in zenwave-architecture.yml.
        required: true
        type: string
      version:
        description: Released version (release/{artifact}/vX tag) of the source artifact to provision.
        required: true
        type: string
      kafka_version:
        description: Version for this Kafka provisioning bundle, independent of the source artifact version.
        required: true
        type: string
      pipeline_ref:
        description: Git ref to use when checking out the shared pipeline repository.
        required: false
        default: main
        type: string
      architecture_manifest_uri:
        required: false
        default: https://raw.githubusercontent.com/arcadia-editions/arcadia-editions-architecture/main/zenwave-architecture.yml
        type: string
      avro_imports:
        description: Comma-separated Avro schema files or folders, relative to the source repository root, loaded before owned schemas are bundled.
        required: false
        default: ""
        type: string
      java_distribution:
        required: false
        default: temurin
        type: string
      java_version:
        required: false
        default: "21"
        type: string
    secrets:
      checkout_token:
        required: false

permissions:
  contents: write

concurrency:
  group: kafka-release-${{ github.repository }}-${{ inputs.artifact }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Terraform bundle
    runs-on: ubuntu-latest
    env:
      AVRO_IMPORTS: ${{ inputs.avro_imports }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout shared pipeline repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arcadia-editions/api-product-workflows
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          path: pipeline-repo

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Set up JBang
        uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de # main
        with:
          version: 0.138.0

      - name: Install ZenWave CLI alias
        uses: ./pipeline-repo/.github/actions/install-zenwave-alias
        with:
          alias: ${{ vars.ZENWAVE_ALIAS || 'release@zenwave360/zenwave-sdk' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Resolve Kafka artifact from the architecture manifest
        id: resolve
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.architecture_manifest_uri }}
        run: |
          repository="${{ inputs.service_repo }}"
          record="$(jbang --quiet ./pipeline-repo/scripts/artifacts/ManifestTool.java resolve "$MANIFEST_URI" "$repository" "${{ inputs.artifact }}")"
          type="$(jq -r .type <<< "$record")"
          if [[ "$type" != "asyncapi" && "$type" != "asyncapi-client" ]]; then
            echo "artifact ${{ inputs.artifact }} is type '$type', not asyncapi or asyncapi-client" >&2
            exit 1
          fi
          echo "artifact_id=$(jq -r .artifactId <<< "$record")" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$(jq -r .path <<< "$record")" >> "$GITHUB_OUTPUT"

      - name: Reject an already-released kafka_version
        shell: bash
        run: |
          tag="release/kafka/${{ steps.resolve.outputs.artifact_id }}/v${{ inputs.kafka_version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag" >&2
            exit 1
          fi

      - name: Checkout released artifact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arcadia-editions/${{ inputs.service_repo }}
          ref: refs/tags/release/${{ steps.resolve.outputs.artifact_id }}/v${{ inputs.version }}
          path: service-repo

      - name: Generate Terraform from AsyncAPI
        shell: bash
        run: |
          chmod +x ./pipeline-repo/scripts/terraform/provision-kafka.sh
          cd service-repo
          ../pipeline-repo/scripts/terraform/provision-kafka.sh \
            ../pipeline-repo \
            "${{ steps.resolve.outputs.artifact_path }}" \
            prod \
            "${{ inputs.service_repo }}" \
            "${{ steps.resolve.outputs.artifact_id }}"

      - name: Sanity-check generated Terraform offline
        working-directory: service-repo/target/terraform/${{ steps.resolve.outputs.artifact_id }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: Record bundle provenance
        shell: bash
        run: |
          jq -n \
            --arg artifact_id "${{ steps.resolve.outputs.artifact_id }}" \
            --arg kafka_version "${{ inputs.kafka_version }}" \
            --arg version "${{ inputs.version }}" \
            '{artifact_id: $artifact_id, kafka_version: $kafka_version, version: $version}' \
            > "service-repo/target/terraform/${{ steps.resolve.outputs.artifact_id }}/RELEASE.json"

      - name: Create Terraform bundle
        shell: bash
        run: |
          cd service-repo
          zip -r "${{ inputs.service_repo }}-${{ steps.resolve.outputs.artifact_id }}-kafka-v${{ inputs.kafka_version }}-terraform.zip" \
            "target/terraform/${{ steps.resolve.outputs.artifact_id }}" \
            -x "target/terraform/${{ steps.resolve.outputs.artifact_id }}/.terraform/*"

      - name: Publish Kafka release
        shell: bash
        run: |
          tag="release/kafka/${{ steps.resolve.outputs.artifact_id }}/v${{ inputs.kafka_version }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "kafka ${{ steps.resolve.outputs.artifact_id }} v${{ inputs.kafka_version }}" \
            --notes "Kafka provisioning bundle for ${{ steps.resolve.outputs.artifact_id }}, built from version ${{ inputs.version }}." \
            "service-repo/${{ inputs.service_repo }}-${{ steps.resolve.outputs.artifact_id }}-kafka-v${{ inputs.kafka_version }}-terraform.zip"
